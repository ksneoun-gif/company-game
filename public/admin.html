<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>회사 키우기 - 운영자 대시보드</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { font-family: 'Pretendard Variable', sans-serif; background: #f4f5f7; padding: 20px; color: #111; }
        .container { max-width: 1200px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; border: 3px solid #111; box-shadow: 6px 6px 0px #111; }
        h1 { margin-top: 0; color: #2A82FF; }
        .control-panel { margin-bottom: 20px; padding: 15px; background: #FFF4E8; border: 2px solid #111; border-radius: 10px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        input { padding: 10px; font-size: 15px; border: 2px solid #111; border-radius: 8px; }
        button { padding: 10px 18px; font-size: 15px; font-weight: bold; background: #111; color: white; border: 2px solid #111; border-radius: 8px; cursor: pointer; transition: 0.1s; }
        button:active { transform: translate(2px, 2px); }
        .btn-reset { background: #4B5563; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; text-align: center; }
        th, td { border: 2px solid #111; padding: 12px; }
        th { background: #111; color: white; }
        .action-container { display: flex; gap: 12px; margin-top: 20px; }
        .btn-next { background: #FF5E3A; color: white; flex: 2; padding: 16px; font-size: 18px; font-weight: 900; box-shadow: 4px 4px 0px #111; cursor: pointer; border: 2px solid #111; border-radius: 10px; }
        .btn-end-game { background: #111; color: #FFE347; flex: 1; padding: 16px; font-size: 17px; font-weight: 900; box-shadow: 4px 4px 0px #111; cursor: pointer; border: 2px solid #111; border-radius: 10px; }
        .btn-kick { background: #E11D48; color: white; padding: 6px 10px; font-size: 12px; border: 2px solid #111; border-radius: 6px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>👑 게임 관제 대시보드</h1>
        
        <div class="control-panel">
            <label><b>세션 번호:</b></label>
            <input type="text" id="sessionCode" placeholder="세션 번호 입력">
            <button onclick="connectAdmin()">대시보드 접속</button>
            <button class="btn-reset" onclick="resetSession()">🔄 세션 전체 초기화</button>
            <span style="font-size: 13px; color: #666; margin-left: auto;">* 이전 참가자나 유령 참가자가 남아있다면 '세션 전체 초기화'를 누르세요.</span>
        </div>

        <table>
            <thead>
                <tr>
                    <th>참여자 정보</th>
                    <th>현재 턴</th>
                    <th>보유 현금</th>
                    <th>신뢰도 / 부채</th>
                    <th>최근 행동</th>
                    <th>턴 상태</th>
                    <th>관리</th>
                </tr>
            </thead>
            <tbody id="player-list">
                <tr><td colspan="7">세션에 접속하여 참가자 대기 중...</td></tr>
            </tbody>
        </table>

        <div class="action-container">
            <button class="btn-next" id="btn-next-turn" onclick="forceNextTurn()">전체 인원 일괄 다음 턴 진행 ➡️</button>
            <button class="btn-end-game" onclick="forceEndGame()">🏁 게임 강제 종료 (최종 결산)</button>
        </div>
    </div>

    <script>
        const socket = io({
            reconnection: true,
            reconnectionAttempts: Infinity,
            reconnectionDelay: 1000,
            timeout: 20000
        });
        
        let currentSession = "";

        function connectAdmin() {
            currentSession = document.getElementById("sessionCode").value.trim();
            if (!currentSession) return alert("세션 번호를 입력하세요.");
            socket.emit('join_game', { sessionCode: currentSession, isOperator: true });
            alert(`[${currentSession}] 세션 관제를 시작합니다.`);
        }

        socket.on('update_dashboard', (players) => {
            const tbody = document.getElementById("player-list");
            tbody.innerHTML = "";
            let allDone = true;
            let playerCount = 0;
            let allAtTurnTen = true;
            let activeCount = 0;

            for (let id in players) {
                playerCount++;
                const p = players[id];
                
                if (!p.status.includes('파산') && !p.status.includes('종료') && !p.status.includes('완료')) {
                    activeCount++;
                    if (p.turn < 10) allAtTurnTen = false;
                    if (p.status !== '턴 완료 (대기중)') allDone = false;
                }
                
                let statusColor = p.status.includes('턴 완료') ? '#2A82FF' : (p.status.includes('파산') || p.status.includes('끊김') ? '#E11D48' : '#111');

                tbody.innerHTML += `
                    <tr>
                        <td><b>${p.rank} ${p.name}</b><br><small>${p.milId}</small></td>
                        <td><b>${p.turn}</b> / 10 턴</td>
                        <td style="color:#2A82FF; font-weight:900;">${Number(p.balance).toLocaleString()} ₩</td>
                        <td>${p.trust}% / ${p.debt}%</td>
                        <td>${p.lastAction || '-'}</td>
                        <td style="color:${statusColor}; font-weight:bold;">${p.status}</td>
                        <td><button class="btn-kick" onclick="kickPlayer('${id}')">퇴장</button></td>
                    </tr>
                `;
            }

            const btnNext = document.getElementById("btn-next-turn");
            if (playerCount === 0) {
                tbody.innerHTML = `<tr><td colspan="7">현재 접속 중인 참가자가 없습니다.</td></tr>`;
                btnNext.style.backgroundColor = "#FF5E3A";
                btnNext.style.color = "white";
                btnNext.innerText = "전체 인원 일괄 다음 턴 진행 ➡️";
            } else if (allAtTurnTen && activeCount > 0) {
                btnNext.style.backgroundColor = "#2A82FF";
                btnNext.style.color = "white";
                btnNext.innerText = "🏆 10턴 마감 완료! [최종 결산 진행] ➡️";
            } else if (allDone) {
                btnNext.style.backgroundColor = "#47FF88";
                btnNext.style.color = "#111";
                btnNext.innerText = "✅ 전원 대기 완료! 다음 턴 진행 ➡️";
            } else {
                btnNext.style.backgroundColor = "#FF5E3A";
                btnNext.style.color = "white";
                btnNext.innerText = "⏳ 의사결정 진행 중... 강제 다음 턴 진행 ➡️";
            }
        });

        function forceNextTurn() {
            if (!currentSession) return alert("세션에 먼저 접속하세요.");
            if (confirm("진행 중인 턴을 마감하고 다음 턴으로 넘기시겠습니까? (10턴 도달 시 자동 종료)")) {
                socket.emit('force_next_turn', currentSession);
            }
        }

        function forceEndGame() {
            if (!currentSession) return alert("세션에 먼저 접속하세요.");
            if (confirm("모든 참가자의 게임을 즉시 중단하고 '최종 경영 결산 보고서' 화면으로 넘기시겠습니까?")) {
                socket.emit('force_end_game', currentSession);
            }
        }

        function kickPlayer(socketId) {
            if (!currentSession) return;
            if (confirm("해당 참가자를 세션에서 완전히 삭제하시겠습니까?")) {
                socket.emit('kick_player', { sessionCode: currentSession, socketId });
            }
        }

        function resetSession() {
            if (!currentSession) return alert("세션 번호를 먼저 입력하고 접속하세요.");
            if (confirm(`[${currentSession}] 세션의 모든 참가자를 내보내고 명단을 완전히 초기화하시겠습니까?\n(새 게임 시작 시 유령 참가자를 정리할 때 사용합니다.)`)) {
                socket.emit('reset_session', currentSession);
            }
        }
    </script>
</body>
</html>

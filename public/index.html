<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>비행단 예산 통제 대시보드</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { font-family: 'Pretendard Variable', sans-serif; background: #F4F7FB; padding: 20px; color: #111827; }
        .container { max-width: 1300px; margin: 0 auto; background: #FFFFFF; padding: 25px; border-radius: 12px; border: 2px solid #D1D5DB; box-shadow: 0 4px 14px rgba(0,0,0,0.05); }
        h1 { margin-top: 0; color: #0055FF; font-weight: 900; letter-spacing: -0.5px; }
        .control-panel { margin-bottom: 20px; padding: 15px; background: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 10px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        input { padding: 10px; font-size: 15px; border: 1px solid #CBD5E1; border-radius: 8px; outline: none; }
        input:focus { border-color: #0055FF; box-shadow: 0 0 0 3px rgba(0,85,255,0.1); }
        button { padding: 10px 18px; font-size: 14px; font-weight: bold; background: #0055FF; color: white; border: none; border-radius: 8px; cursor: pointer; transition: 0.1s; }
        button:hover { background: #0044CC; }
        button:active { transform: translateY(2px); }
        .btn-reset { background: #64748B; }
        .btn-reset:hover { background: #475569; }
        .btn-grant { background: #10B981; padding: 6px 10px; font-size: 12px; border-radius: 6px; margin-right: 5px; }
        .btn-grant:hover { background: #059669; }
        .btn-grant:disabled { background: #94A3B8; cursor: not-allowed; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; text-align: center; font-size: 14px; }
        th, td { border: 1px solid #E2E8F0; padding: 12px; vertical-align: middle; }
        th { background: #0055FF; color: white; font-weight: 700; }
        td { background: #FFFFFF; }
        .action-container { display: flex; gap: 12px; margin-top: 20px; }
        .btn-next { background: #0055FF; color: white; flex: 2; padding: 16px; font-size: 18px; font-weight: 900; cursor: pointer; border-radius: 10px; }
        .btn-end-game { background: #1E293B; color: #FFFFFF; flex: 1; padding: 16px; font-size: 17px; font-weight: 900; cursor: pointer; border-radius: 10px; }
        .btn-kick { background: #EF4444; color: white; padding: 6px 10px; font-size: 12px; border-radius: 6px; border: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🦅 비행단 예산 통제 대시보드</h1>
        
        <div class="control-panel">
            <label><b>세션 번호:</b></label>
            <input type="text" id="sessionCode" placeholder="예: 777">
            <button onclick="connectAdmin()">국방망 대시보드 접속</button>
            <button class="btn-reset" onclick="resetSession()">🔄 세션 전체 초기화</button>
            <span style="font-size: 13px; color: #64748B; margin-left: auto;">* 4~8분기에만 개별 관서에 '추경'을 부여할 수 있습니다.</span>
        </div>

        <table>
            <thead>
                <tr>
                    <th>관서(참여자) 정보</th>
                    <th>회계 분기</th>
                    <th>가용 세출예산 / 집행률</th>
                    <th>가동률 / 불용·감사</th>
                    <th>최근 지출결의</th>
                    <th>결산 상태</th>
                    <th>특별 관리</th>
                </tr>
            </thead>
            <tbody id="player-list">
                <tr><td colspan="7" style="color: #64748B;">세션에 접속하여 예산 통제 대기 중...</td></tr>
            </tbody>
        </table>

        <div class="action-container">
            <button class="btn-next" id="btn-next-turn" onclick="forceNextTurn()">전 관서 일괄 다음 분기 진행 ➡️</button>
            <button class="btn-end-game" onclick="forceEndGame()">🏁 회계연도 강제 출납폐쇄 (종합 결산)</button>
        </div>
    </div>

    <script>
        let socket;
        try { socket = io({ reconnection: true, reconnectionAttempts: Infinity, timeout: 20000 }); } 
        catch (e) { socket = { emit: function(){}, on: function(){} }; }
        
        let currentSession = "";

        function connectAdmin() {
            currentSession = document.getElementById("sessionCode").value.trim();
            if (!currentSession) return alert("세션 번호를 입력하세요.");
            socket.emit('join_game', { sessionCode: currentSession, isOperator: true });
            alert(`[${currentSession}] 세션 예산 통제를 시작합니다.`);
        }

        socket.on('update_dashboard', (players) => {
            const tbody = document.getElementById("player-list");
            tbody.innerHTML = "";
            let allDone = true, playerCount = 0, allAtTurnTen = true, activeCount = 0;

            for (let id in players) {
                playerCount++;
                const p = players[id];
                
                if (!p.status.includes('사고') && !p.status.includes('종료') && !p.status.includes('완료')) {
                    activeCount++;
                    if (p.turn < 10) allAtTurnTen = false;
                    if (p.status !== '결산 마감 (대기중)') allDone = false;
                }
                
                let statusColor = p.status.includes('결산 마감') ? '#0055FF' : (p.status.includes('사고') || p.status.includes('끊김') ? '#EF4444' : '#111827');
                let execRate = p.execRate !== undefined ? p.execRate.toFixed(1) : "0.0";
                
                // 💡 4~8턴에만 추경 부여 활성화
                let canGrant = (p.turn >= 4 && p.turn <= 8 && !p.status.includes('사고'));

                tbody.innerHTML += `
                    <tr>
                        <td><b>${p.rank} ${p.name}</b><br><small style="color:#64748B;">${p.milId}</small></td>
                        <td><b>${p.turn}</b> / 10 분기</td>
                        <td><span style="color:#0055FF; font-weight:900;">${Number(p.balance).toLocaleString()} ₩</span><br><small style="font-weight:bold; color:#10B981;">(집행률: ${execRate}%)</small></td>
                        <td><span style="color:#0055FF; font-weight:bold;">${p.trust}%</span> / <span style="color:${p.debt > 30 ? '#EF4444' : '#111827'}">${p.debt}%</span></td>
                        <td>${p.lastAction || '-'}</td>
                        <td style="color:${statusColor}; font-weight:bold;">${p.status}</td>
                        <td>
                            <button class="btn-grant" onclick="grantBudget('${id}', '${p.name}')" ${canGrant ? '' : 'disabled'}>추경</button>
                            <button class="btn-kick" onclick="kickPlayer('${id}')">해제</button>
                        </td>
                    </tr>
                `;
            }

            const btnNext = document.getElementById("btn-next-turn");
            if (playerCount === 0) {
                tbody.innerHTML = `<tr><td colspan="7" style="color: #64748B;">현재 접속 중인 관서가 없습니다.</td></tr>`;
                btnNext.style.background = "#94A3B8"; btnNext.innerText = "전 관서 일괄 다음 분기 진행 ➡️";
            } else if (allAtTurnTen && activeCount > 0) {
                btnNext.style.background = "#0055FF"; btnNext.innerText = "🏆 10분기 완료! [재정 종합 결산 진행] ➡️";
            } else if (allDone) {
                btnNext.style.background = "#10B981"; btnNext.innerText = "✅ 전 관서 대기 완료! 다음 분기 진행 ➡️";
            } else {
                btnNext.style.background = "#0055FF"; btnNext.innerText = "⏳ 예산 집행 진행 중... 강제 다음 분기 진행 ➡️";
            }
        });

        function grantBudget(socketId, playerName) {
            if (!currentSession) return;
            let amountStr = prompt(`[${playerName}] 관서에 부여할 국방부 특별 추경 예산을 입력하세요.\n(예: 30000000)`, "30000000");
            if (amountStr) {
                let amount = parseInt(amountStr);
                if (!isNaN(amount) && amount > 0) {
                    socket.emit('admin_grant_budget', { sessionCode: currentSession, targetId: socketId, amount: amount });
                } else {
                    alert("올바른 금액을 입력하세요.");
                }
            }
        }

        function forceNextTurn() {
            if (!currentSession) return alert("세션에 접속하세요.");
            if (confirm("진행 중인 분기를 마감하고 다음 분기로 넘기시겠습니까?")) socket.emit('force_next_turn', currentSession);
        }

        function forceEndGame() {
            if (!currentSession) return alert("세션에 접속하세요.");
            if (confirm("모든 관서의 집행을 즉시 중단하고 종합 결산으로 넘기시겠습니까?")) socket.emit('force_end_game', currentSession);
        }

        function kickPlayer(socketId) {
            if (confirm("참여자를 세션에서 완전히 삭제하시겠습니까?")) socket.emit('kick_player', { sessionCode: currentSession, socketId });
        }

        function resetSession() {
            if (!currentSession) return alert("세션 번호를 입력하세요.");
            if (confirm(`세션의 모든 참가자를 내보내고 초기화하시겠습니까?`)) socket.emit('reset_session', currentSession);
        }
    </script>
</body>
</html>
